name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shifoxona_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_NAME: shifoxona_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_PORT: 5432
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: python manage.py migrate

      - name: Run tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_NAME: shifoxona_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_PORT: 5432
          SECRET_KEY: test-secret-key
          DEBUG: "True"
        run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build
