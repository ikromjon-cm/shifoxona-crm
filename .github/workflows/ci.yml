name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shifoxona_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        working-directory: ./backend
        continue-on-error: true
        run: ruff check . --no-fix

      - name: Run migrations
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_NAME: shifoxona_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_PORT: 5432
          SECRET_KEY: test-secret-key
          DEBUG: "True"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: python manage.py migrate

      - name: Run tests
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_NAME: shifoxona_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_PORT: 5432
          SECRET_KEY: test-secret-key
          DEBUG: "True"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: python manage.py test --verbosity=2

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        continue-on-error: true
        run: npx eslint src --ext .js,.jsx,.ts,.tsx 2>/dev/null || echo "No lint config found"

      - name: Build
        working-directory: ./frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shifoxona_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run migrations
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_NAME: shifoxona_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_PORT: 5432
          SECRET_KEY: test-secret-key
          DEBUG: "True"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: python manage.py migrate

      - name: Start backend
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_NAME: shifoxona_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_PORT: 5432
          SECRET_KEY: test-secret-key
          DEBUG: "True"
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          sleep 3

      - name: Run E2E tests
        working-directory: ./frontend
        run: npx playwright test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.30'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze
        working-directory: ./mobile
        run: flutter analyze

      - name: Build APK
        working-directory: ./mobile
        run: flutter build apk --release --split-per-abi

      - name: Build iOS (IPA)
        if: github.ref == 'refs/heads/main' && runner.os == 'macOS'
        working-directory: ./mobile
        run: |
          flutter build ios --release --no-codesign
          mkdir -p build/ios
          cd build/ios
          xcrun xcodebuild -workspace ../ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -archivePath Runner.xcarchive archive
          xcrun xcodebuild -exportArchive \
            -archivePath Runner.xcarchive \
            -exportPath . \
            -exportOptionsPlist ../../ios/ExportOptions.plist

      - name: Upload iOS Artifact
        if: github.ref == 'refs/heads/main' && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: shifoxona-ios.ipa
          path: mobile/build/ios/*.ipa

  deploy-render:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/deploy/srv/${{ secrets.RENDER_SERVICE_ID }}?key=${{ secrets.RENDER_DEPLOY_KEY }}"
