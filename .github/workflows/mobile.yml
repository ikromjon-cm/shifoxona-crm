name: Mobile CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29'

      - name: Install dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Run analyze
        run: |
          cd mobile
          flutter analyze

      - name: Run dart fix dry-run
        run: |
          cd mobile
          dart fix --dry-run
