apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shifoxona
  labels:
    app: backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: backend
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shifoxona
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: shifoxona-backend:latest
          ports:
            - containerPort: 8000
              name: backend
          envFrom:
            - configMapRef:
                name: shifoxona-config
            - secretRef:
                name: shifoxona-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
