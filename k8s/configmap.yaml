apiVersion: v1
kind: ConfigMap
metadata:
  name: shifoxona-config
  namespace: shifoxona
data:
  DEBUG: "False"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  DJANGO_ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "http://localhost:80,http://localhost:5173,http://frontend:80"
