services:
  - type: web
    name: shifoxona-backend
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && bash startup.sh
    healthCheckPath: /api/v1/accounts/login/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shifoxona-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings

databases:
  - name: shifoxona-db
    plan: free
    region: frankfurt
